# README の activity / recent-languages ブロックを毎日書き換える。
# private リポを含む集計値だけを出力し、リポ名とコミットメッセージは出さない。
# metrics.yml も同じ main へコミットするので、push 前に必ず rebase する。
name: Activity
on:
  schedule: [{cron: "30 16 * * *"}]
  workflow_dispatch:
  push: {branches: ["main"]}
jobs:
  activity:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Collect and write activity
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          set -euo pipefail

          gh api graphql \
            -f login=unicco \
            -f from="$(date -u -d '30 days ago' +%Y-%m-%dT%H:%M:%SZ)" \
            -f to="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -f query='query($login:String!,$from:DateTime!,$to:DateTime!){
              user(login:$login){ contributionsCollection(from:$from,to:$to){
                totalCommitContributions
                restrictedContributionsCount
                totalPullRequestContributions
                commitContributionsByRepository(maxRepositories:100){
                  contributions{totalCount}
                  repository{id primaryLanguage{name}}
                }
                pullRequestContributionsByRepository(maxRepositories:100){repository{id}}
              }}}' > stats.json

          c=.data.user.contributionsCollection
          commits=$(jq "$c.totalCommitContributions" stats.json)
          restricted=$(jq "$c.restrictedContributionsCount" stats.json)
          prs=$(jq "$c.totalPullRequestContributions" stats.json)
          repos=$(jq "[$c | (.commitContributionsByRepository[].repository.id), (.pullRequestContributionsByRepository[].repository.id)] | unique | length" stats.json)

          # metrics の recently-used は public の events しか辿れないので、
          # 直近のコミット先リポジトリの主言語をコミット数で重み付けして自前で出す。
          langs=$(jq -r "[$c.commitContributionsByRepository[]
            | select(.repository.primaryLanguage != null)
            | {lang: .repository.primaryLanguage.name, n: .contributions.totalCount}]
            | group_by(.lang) | map({lang: .[0].lang, n: (map(.n) | add)})
            | sort_by(-.n) | .[0:5] | map(.lang) | join(\" · \")" stats.json)
          rm -f stats.json

          # METRICS_TOKEN が private を読めないと commits が公開ぶんだけになり、
          # 残りが restricted へ落ちる。黙って過少な数字を出さず job を落とす。
          if [ "$restricted" -gt "$commits" ]; then
            echo "::error::token cannot see private contributions (commits=$commits restricted=$restricted)"
            exit 1
          fi
          if [ -z "$langs" ]; then
            echo "::error::no recent languages resolved (token scope or query shape changed)"
            exit 1
          fi

          write_block() {
            local name="$1" text="$2"
            if ! grep -q "<!-- $name starts -->" README.md || ! grep -q "<!-- $name ends -->" README.md; then
              echo "::error::$name markers not found in README.md"
              exit 1
            fi
            awk -v name="$name" -v text="$text" '
              $0 ~ "<!-- " name " starts -->" { print; print text; skip = 1; next }
              $0 ~ "<!-- " name " ends -->"   { skip = 0 }
              !skip                           { print }
            ' README.md > README.next
            mv README.next README.md
          }

          write_block activity "Last 30 days: ${commits} commits · ${prs} pull requests · ${repos} repositories — updated $(date -u +%Y-%m-%d)"
          write_block recent-languages "**Recently used** — ${langs}"

          if git diff --quiet README.md; then
            echo "no change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore(activity): refresh last 30 days"
          git pull --rebase origin main
          git push
