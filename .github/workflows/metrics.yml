# 草と言語比率だけを描く。ほかの指標（follower・star・Sponsors・Packages）は
# GitHub 標準のプロフィール UI と重複するか、0 が並んで実態より弱く見えるので出さない。
# 出力はどちらも集計値のみで、private リポ名とコミットメッセージは含まれない。
name: Metrics
on:
  schedule: [{cron: "0 16 * * *"}]
  workflow_dispatch:
  push: {branches: ["main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Calendar
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: unicco
          filename: metrics.calendar.svg
          base: ""
          config_display: large
          config_padding: 8
          config_timezone: Asia/Tokyo
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Languages
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: unicco
          filename: metrics.languages.svg
          base: ""
          config_display: large
          config_padding: 8
          config_timezone: Asia/Tokyo
          plugin_languages: yes
          plugin_languages_sections: most-used, recently-used
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_recent_days: 30
